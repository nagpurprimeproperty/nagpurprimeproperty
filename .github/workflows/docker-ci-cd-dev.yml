name: Dev Docker Build & Deploy to VPS

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push-dev:
    name: Build & Push Dev Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend (Dev)
      - name: Build & Push Backend Dev Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-backend:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Public Website Dev (Next.js)
      - name: Generate Website Dev Build Env Secret
        run: |
          cat << 'EOF' > /tmp/website_dev_build.env
          NEXT_PUBLIC_API_URL=https://apidevelopment.nagpurprimeproperty.com
          NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_SITE_URL=https://websitedevelopment.nagpurprimeproperty.com
          EOF

      - name: Build & Push Website Dev Image
        uses: docker/build-push-action@v5
        with:
          context: ./website-nextjs
          file: ./website-nextjs/Dockerfile
          push: true
          secret-files: |
            "ENV_FILE=/tmp/website_dev_build.env"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-website:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-website:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push Admin Panel Dev (Next.js)
      - name: Generate Admin Panel Dev Build Env Secret
        run: |
          cat << 'EOF' > /tmp/admin_dev_build.env
          NEXT_PUBLIC_API_URL=/api
          NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_WEBSITE_URL=https://websitedevelopment.nagpurprimeproperty.com
          NEXT_PUBLIC_APP_URL=https://admindevelopment.nagpurprimeproperty.com
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          EOF

      - name: Build & Push Admin Panel Dev Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel-ui
          file: ./admin-panel-ui/dockerfile
          push: true
          secret-files: |
            "ENV_FILE=/tmp/admin_dev_build.env"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-admin:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-admin:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps-dev:
    name: Deploy Updated Dev Images to VPS
    needs: build-and-push-dev
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Navigating to project directory..."
            cd ${{ secrets.VPS_TARGET_DIR }}

            echo "📥 Fetching latest development code..."
            git fetch origin development
            git checkout development || git checkout -b development origin/development
            git reset --hard origin/development

            echo "🔑 Logging in to Docker Hub on VPS..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "🐳 Pulling latest dev images from Docker Hub..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose --env-file .env.development -f docker-compose.dev.yml pull

            echo "🔄 Deploying updated dev containers..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose --env-file .env.development -f docker-compose.dev.yml up -d --remove-orphans

            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f

            echo "✅ Dev Deployment completed successfully!"
