name: Docker Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Public Website (Next.js)
      - name: Generate Website Build Env Secret
        run: |
          cat << 'EOF' > /tmp/website_build.env
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.nagpurprimeproperty.com' }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://nagpurprimeproperty.com' }}
          EOF

      - name: Build & Push Website Image
        uses: docker/build-push-action@v5
        with:
          context: ./website-nextjs
          file: ./website-nextjs/Dockerfile
          push: true
          secret-files: |
            "ENV_FILE=/tmp/website_build.env"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-website:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push Admin Panel (Next.js)
      - name: Generate Admin Panel Build Env Secret
        run: |
          cat << 'EOF' > /tmp/admin_build.env
          NEXT_PUBLIC_API_URL=${{ secrets.ADMIN_NEXT_PUBLIC_API_URL || '/api' }}
          NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
          NEXT_PUBLIC_WEBSITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://nagpurprimeproperty.com' }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || 'https://admin.nagpurprimeproperty.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          EOF

      - name: Build & Push Admin Panel Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel-ui
          file: ./admin-panel-ui/dockerfile
          push: true
          secret-files: |
            "ENV_FILE=/tmp/admin_build.env"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npp-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy Updated Images to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Navigating to project directory..."
            cd ${{ secrets.VPS_TARGET_DIR }}

            echo "📥 Fetching latest docker-compose and configs..."
            git fetch origin main
            git checkout main || git checkout -b main origin/main
            git reset --hard origin/main

            echo "🔑 Logging in to Docker Hub on VPS..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "🐳 Pulling latest images from Docker Hub..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose -p npp-prod -f docker-compose.prod.yml pull

            echo "🔄 Deploying updated containers..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose -p npp-prod -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Cleaning up dangling/old Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
