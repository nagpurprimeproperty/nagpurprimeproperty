# =================================================================
# NGINX REVERSE PROXY FOR NAGPUR PRIME PROPERTY (PRODUCTION)
# =================================================================

server_tokens off;

# Rate Limiting Zones (keyed by client IP)
limit_req_zone $binary_remote_addr zone=api_prod_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_prod_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=web_prod_limit:10m rate=50r/s;

# ── 1. HTTP -> HTTPS Global Redirect ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nagpurprimeproperty.com www.nagpurprimeproperty.com api.nagpurprimeproperty.com admin.nagpurprimeproperty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. Production Website (nagpurprimeproperty.com) ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nagpurprimeproperty.com www.nagpurprimeproperty.com;

    ssl_certificate /etc/letsencrypt/live/nagpurprimeproperty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nagpurprimeproperty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 10M;

    location / {
        limit_req zone=web_prod_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 3. Production API Backend (api.nagpurprimeproperty.com) ────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nagpurprimeproperty.com;

    ssl_certificate /etc/letsencrypt/live/api.nagpurprimeproperty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nagpurprimeproperty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 50M;

    location /api/v1/auth/ {
        limit_req zone=auth_prod_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_prod_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 4. Production Admin Panel (admin.nagpurprimeproperty.com) ───────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nagpurprimeproperty.com;

    ssl_certificate /etc/letsencrypt/live/admin.nagpurprimeproperty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nagpurprimeproperty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/security-headers.conf;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
