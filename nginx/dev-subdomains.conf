# =================================================================
# NGINX REVERSE PROXY FOR NAGPUR PRIME PROPERTY (DEV SUBDOMAINS)
# =================================================================

server_tokens off;

# Rate Limiting Zones (keyed by client IP)
limit_req_zone $binary_remote_addr zone=api_dev_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_dev_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=web_dev_limit:10m rate=50r/s;

# 1. Dev Website (websitedevelopment.nagpurprimeproperty.com) -> Port 3002
server {
    listen 80;
    server_name websitedevelopment.nagpurprimeproperty.com;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 10M;

    location / {
        limit_req zone=web_dev_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Dev API (apidevelopment.nagpurprimeproperty.com) -> Port 4001
server {
    listen 80;
    server_name apidevelopment.nagpurprimeproperty.com;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 50M;

    location /api/v1/auth/ {
        limit_req zone=auth_dev_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_dev_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Dev Admin Panel (admindevelopment.nagpurprimeproperty.com) -> Port 3003
server {
    listen 80;
    server_name admindevelopment.nagpurprimeproperty.com;

    include /etc/nginx/conf.d/security-headers.conf;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
